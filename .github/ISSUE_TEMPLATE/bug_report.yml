name: Bug Report
description: Create a report to help us improve
title: "[Bug] "
type: bug
body:
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: To Reproduce
      description: Steps to reproduce the behavior.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, add screenshots to help explain your problem.

  - type: input
    id: platform
    attributes:
      label: Platform
      description: The platform you are using. (e.g. Windows 10, macOS 10.15, Ubuntu 20.04)

  - type: input
    id: version
    attributes:
      label: Version
      description: The version of the application you are using. (e.g. 1.0.0)

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: If Bedrock Nexus fails to open or closes immediately, please attach `%APPDATA%\\BedrockNexus.exe\\logs\\startup.log`.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add any other context about the problem here. If startup fails before the UI appears, include `%APPDATA%\\BedrockNexus.exe\\logs\\startup.log` when possible.
