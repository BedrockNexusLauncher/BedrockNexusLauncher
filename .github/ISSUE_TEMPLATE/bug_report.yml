name: Bug report
description: Report a problem with Bedrock Nexus
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? Include the steps to reproduce the problem if you can.
      placeholder: Describe the problem…
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: Windows 11 (10.0.22631)
  - type: input
    id: version
    attributes:
      label: Bedrock Nexus version
      placeholder: 1.0.0
  - type: textarea
    id: logs
    attributes:
      label: Diagnostics / logs
      description: Diagnostics generated by the launcher (Settings → Report a Problem attaches this automatically). Remove anything you do not want to share.
      render: text
