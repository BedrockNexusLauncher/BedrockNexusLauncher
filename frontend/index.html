<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
      name="viewport"
    />
    <!-- Defense in depth for the WebView: only same-origin scripts may run
         (head initialisation lives in /head-init.js for this reason), no
         plugins/frames, and remote content is limited to images/media and
         HTTPS fetches the UI performs. If a future feature needs another
         source, extend the matching directive here — do not drop the CSP. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: ws: wss:; media-src 'self' data: blob: https:; object-src 'none'; base-uri 'self'; frame-src 'none'"
    />
    <title>Bedrock Nexus</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <script src="./head-init.js"></script>
  </head>

  <body>
    <div id="root"></div>
    <script src="./src/main.jsx" type="module"></script>
  </body>
</html>
