         <script>
      // The launcher engine is always LTR. Before first paint we only set the
      // `rtl-locale` class for RTL locales (fa) so the CSS text-alignment
      // rules in style.css (e.g. `html.rtl-locale body { text-align: right }`)
      // take effect on first paint. Without this, text renders left-aligned
      // until i18n.ts runs — which can lag behind due to async i18next
      // resource loading, causing a visible FOUC.
      (function () {
        try {
          var _lang = (
            localStorage.getItem("i18nextLng") ||
            navigator.language ||
            "en"
          ).toLowerCase();
          var _isRtl = _lang.indexOf("fa") === 0;
          var _html = document.documentElement;
          _html.setAttribute("dir", "ltr");
          _html.classList.toggle("rtl-locale", _isRtl);
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script src="./src/main.jsx" type="module"></script>
  </body>
</html>
