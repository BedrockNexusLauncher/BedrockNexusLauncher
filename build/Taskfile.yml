version: '3'

tasks:
  doctor:
    summary: Checks required tools for building Bedrock Nexus
    preconditions:
      - sh: go version
        msg: "Go is required. Install Go 1.25.3 or newer."
      - sh: node --version
        msg: "Node.js is required. Install the current LTS release."
      - sh: npm --version
        msg: "npm is required. Install it with Node.js."
      - sh: wails3 version
        msg: "Wails CLI v3 is required. Install it before building."
      - sh: task --version
        msg: "Task is required. Install go-task."
    cmds:
      - go version
      - node --version
      - npm --version
      - wails3 version
      - task --version

  clean:
    summary: Removes generated frontend, binding, binary, and symbol output
    cmds:
      - cmd: powershell -NoLogo -NoProfile -Command "Remove-Item -Recurse -Force -ErrorAction SilentlyContinue frontend/dist, frontend/node_modules, frontend/bindings, bin, *.syso"
        platforms: [windows]
      - cmd: rm -rf frontend/dist frontend/node_modules frontend/bindings bin *.syso
        platforms: [linux, darwin]

  verify:
    summary: Runs frontend type-checking and a production frontend build
    deps:
      - task: install:frontend:deps
    cmds:
      - task: generate:bindings
        vars:
          BUILD_FLAGS: "-tags production"
      - cmd: npm run type-check
        dir: frontend
      - cmd: npm run build -q
        dir: frontend

  "go:mod:tidy":
    summary: Runs `go mod tidy` (manual maintenance; not part of the build path)
    internal: true
    cmds:
      - go mod tidy

  "go:mod:download":
    summary: Ensures Go modules are cached (cached by go.mod/go.sum checksum)
    internal: true
    sources:
      - go.mod
      - go.sum
    generates:
      - go.mod
      - go.sum
    cmds:
      - go mod download

  "install:frontend:deps":
    summary: Install frontend dependencies
    dir: frontend
    sources:
      - package.json
      - package-lock.json
    generates:
      - node_modules
    preconditions:
      - sh: npm version
        msg: "Looks like npm isn't installed. Npm is part of the Node installer: https://nodejs.org/en/download/"
    cmds:
      - npm install --no-audit --no-fund --prefer-offline

  "build:frontend":
    label: build:frontend (PRODUCTION={{.PRODUCTION}})
    summary: Build the frontend project
    dir: frontend
    sources:
      - "**/*"
      - exclude: node_modules/**/*
      - exclude: dist/**/*
    generates:
      - dist/**/*
    deps:
      - task: install:frontend:deps
      - task: generate:bindings
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
    cmds:
      - npm run {{.BUILD_COMMAND}} -q
    env:
      PRODUCTION: '{{.PRODUCTION | default "false"}}'
    vars:
      BUILD_COMMAND: '{{if eq .PRODUCTION "true"}}build{{else}}build:dev{{end}}'


  "generate:bindings":
    label: generate:bindings (BUILD_FLAGS={{.BUILD_FLAGS}})
    summary: Generates bindings for the frontend
    deps:
      - task: go:mod:download
    sources:
      - "**/*.[jt]s"
      - exclude: frontend/**/*
      - frontend/bindings/**/*  # Rerun when switching between dev/production mode causes changes in output
      - "**/*.go"
      - go.mod
      - go.sum
    generates:
      - frontend/bindings/**/*
    cmds:
      - wails3 generate bindings -f '{{.BUILD_FLAGS}}' -clean=true

  "generate:icons":
    summary: Generates Windows `.ico` and Mac `.icns` files from an image
    dir: build
    sources:
      - "appicon.png"
    generates:
      - "darwin/icons.icns"
      - "windows/icon.ico"
    cmds:
      - wails3 generate icons -input appicon.png -macfilename darwin/icons.icns -windowsfilename windows/icon.ico

  "dev:frontend":
    summary: Runs the frontend in development mode
    dir: frontend
    deps:
      - task: install:frontend:deps
    cmds:
      - npm run dev -- --port {{.VITE_PORT}} --strictPort

  "update:build-assets":
    summary: Updates the build assets
    dir: build
    cmds:
      - wails3 update build-assets -name "{{.APP_NAME}}" -binaryname "{{.APP_NAME}}" -config config.yml -dir .
